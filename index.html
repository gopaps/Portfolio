/* ---------- Render ---------- */
const pm=$('#pm');let G=null;
const cover=p=>p.img[0]==='diagram'?DG:`<img src="${p.img[0]}" alt="${p.n}" loading="lazy" onerror="this.remove()"/>`;
function drawP(){$('#pg').innerHTML=PR.map((p,k)=>({p,k})).filter(({p})=>CF==='all'||p.c===CF).map(({p,k})=>`<article class="ln py-8 grid md:grid-cols-[5fr_6fr] gap-6 md:gap-10 items-center"><button class="cv" data-k="${k}" aria-label="${p.n}">${cover(p)}</button><div><p class="mut text-sm">${t('f'+p.c)}</p><h3 class="mt-1" style="font-size:1.6rem">${p.n}</h3><p class="mut mt-2">${x(p.one)}</p><p class="text-sm mt-3">${p.tools.map(x).join(' · ')}</p><p class="mt-4"><button class="lk" data-k="${k}">${t('det')}</button></p></div></article>`).join('')}
function drawS(){
 $('#sk').innerHTML=SK.map(([n,a])=>`<div><h3 class="text-lg ln pt-3 mb-2">${x(n)}</h3><p class="mut">${a.join(' · ')}</p></div>`).join('');
 $('#tl').innerHTML=TL.map(([y,ty,ti,o,d])=>`<div class="grid sm:grid-cols-[130px_1fr] gap-1 sm:gap-6 ln py-4"><p class="font-semibold" style="color:var(--am)">${x(y)}</p><div><p><span class="ty">${t(ty)}</span></p><h3 class="text-lg mt-1">${x(ti)}</h3><p class="mut">${x(o)}</p>${d?`<p class="mt-1">${x(d)}</p>`:''}</div></div>`).join('')}
function fillM(){const p=G.p;
 $('#mh').innerHTML=`<p class="mut text-sm">${t('f'+p.c)}</p><h3 id="mt" class="text-3xl mt-1 pr-12">${p.n}</h3><p class="mut mt-1">${t('rl')}: ${x(p.role)}</p>`;
 $('#md').innerHTML=`<h4>${t('sum')}</h4><p>${x(p.det)}</p><h4>${t('arch')}</h4><div class="ar">${p.arch.map(a=>`<span>${x(a)}</span>`).join('<i>›</i>')}</div><h4>${t('tools')}</h4><p>${p.tools.map(x).join(' · ')}</p><h4>${t('met')}</h4><div class="mx">${p.met.map(([v,l])=>`<div><b>${x(v)}</b><small>${x(l)}</small></div>`).join('')}</div>`}
function gal(){const p=G.p,s=p.img[G.i],n=p.img.length;
 $('#gm').innerHTML=(s==='diagram'?DG:`<img src="${s}" alt="${p.n} ${G.i+1}" onerror="this.remove()"/>`)+(n>1?`<button class="ib gn" style="left:.5rem" data-d="-1" aria-label="${t('prev')}"><i data-lucide="chevron-left"></i></button><button class="ib gn" style="right:.5rem" data-d="1" aria-label="${t('next')}"><i data-lucide="chevron-right"></i></button>`:'');
 $('#gc').textContent=n>1?`${G.i+1} / ${n}`:'';ic()}
$('#pg').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const p=PR[b.dataset.k];G={p,i:0};
 $('#vw').innerHTML=p.vid?`<video class="vd" src="${p.vid}" controls autoplay muted playsinline preload="metadata"></video>`:'';$('#vwb').style.display=p.vid?'':'none';
 fillM();gal();pm.showModal();pm.scrollTop=0;const v=$('#vw video');if(v)v.play().catch(()=>{})};
$('#mx').onclick=()=>pm.close();
pm.onclick=e=>{if(e.target===pm)pm.close();const d=e.target.closest('[data-d]');if(d){G.i=(G.i+ +d.dataset.d+G.p.img.length)%G.p.img.length;gal()}const im=e.target.closest('#gm img');if(im)zoom(im.src)};
pm.addEventListener('close',()=>{$('#vw').innerHTML='';G=null}); /* menghentikan video saat modal ditutup */
const lb=$('#lb');function zoom(s){$('#li').src=s;lb.showModal()}lb.onclick=()=>lb.close();
$('#ch').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;CF=b.dataset.c;$$('.chip').forEach(c=>c.classList.toggle('on',c===b));drawP()};
$('#pf').onclick=e=>zoom(e.target.src);

/* ---------- Bahasa & tema ---------- */
function setL(l,save){L=l;if(save)try{localStorage.setItem('lg',l)}catch(e){}
 document.documentElement.lang=l;
 $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $$('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph);e.setAttribute('aria-label',t(e.dataset.ph))});
 $$('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al));e.title=t(e.dataset.al)});
 $('#lEN').setAttribute('aria-pressed',l==='en');$('#lID').setAttribute('aria-pressed',l==='id');
 drawP();drawS();if(G){fillM();gal()}
 $$('[data-fb]').forEach(e=>e.textContent=x(FB.find(f=>f[0]===e.dataset.fb)[1]));
 $$('.lf img').forEach(i=>i.alt=x(FB.find(f=>f[0]===i.getAttribute('src'))[1]));ic()}
$('#lEN').onclick=()=>setL('en',1);$('#lID').onclick=()=>setL('id',1);
const root=document.documentElement;let dm;try{dm=localStorage.getItem('th')}catch(e){}
if(dm==='d')root.classList.add('dark'); /* default: terang */
$('#th').onclick=()=>{const d=root.classList.toggle('dark');try{localStorage.setItem('th',d?'d':'l')}catch(e){}};

/* ---------- Flipbook ---------- */
const load=f=>new Promise(r=>{const i=new Image();i.onload=()=>r(f);i.onerror=()=>r(null);i.src=f[0]});
Promise.all(FB.map(load)).then(r=>{
 LF=r.filter(Boolean);const bk=$('#bk');let cur=0,sw=false;
 if(!LF.length){bk.innerHTML='<p class="mut text-center">No images found in assets/.</p>';return}
 bk.innerHTML=LF.map(([s,c],i)=>`<figure class="lf" style="z-index:${LF.length-i}"><img src="${s}" alt="${x(c)}" onclick="zoom(this.src)"/><figcaption><span data-fb="${s}">${x(c)}</span><span class="mut">${i+1} / ${LF.length}</span></figcaption></figure>`).join('');
 $('#dots').innerHTML=LF.map((_,i)=>`<button class="dot" aria-label="${i+1}" data-i2="${i}"></button>`).join('');
 const lv=[...bk.children],dt=$$('.dot');
 const go=n=>{cur=Math.max(0,Math.min(LF.length-1,n));lv.forEach((l,i)=>l.classList.toggle('f',i<cur));dt.forEach((d,i)=>d.classList.toggle('on',i===cur))};
 go(0);
 $('#nx').onclick=()=>go(cur+1);$('#pv').onclick=()=>go(cur-1);
 $('#dots').onclick=e=>{if(e.target.dataset.i2)go(+e.target.dataset.i2)};
 let x0=null;bk.addEventListener('pointerdown',e=>x0=e.clientX);
 bk.addEventListener('pointerup',e=>{if(x0!==null&&Math.abs(e.clientX-x0)>45){go(cur+(e.clientX<x0?1:-1));sw=true}x0=null});
 bk.addEventListener('click',e=>{if(sw){e.stopPropagation();sw=false}},true);
 document.addEventListener('keydown',e=>{if(pm.open||lb.open)return;const b=bk.getBoundingClientRect();if(b.top<innerHeight&&b.bottom>0){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)}});
});
document.addEventListener('keydown',e=>{if(pm.open&&!lb.open&&G&&G.p.img.length>1&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.tagName!=='VIDEO'){G.i=(G.i+(e.key==='ArrowRight'?1:-1)+G.p.img.length)%G.p.img.length;gal()}});

/* ---------- Navigasi, lain-lain ---------- */
const mm=$('#mm'),shut=()=>{mm.classList.add('hidden');mm.classList.remove('flex');$('#mb').setAttribute('aria-expanded',false)};
$('#mb').onclick=()=>{const o=mm.classList.contains('hidden');mm.classList.toggle('hidden',!o);mm.classList.toggle('flex',o);$('#mb').setAttribute('aria-expanded',o)};
mm.onclick=e=>{if(e.target.tagName==='A')shut()};
matchMedia('(min-width:768px)').onchange=shut;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
$$('.rv').forEach(el=>io.observe(el));
addEventListener('scroll',()=>{const u=$('#up'),s=scrollY>600;u.style.opacity=s?1:0;u.style.pointerEvents=s?'auto':'none'},{passive:true});
$('#up').onclick=()=>scrollTo({top:0,behavior:'smooth'});
$('#cf').onsubmit=e=>{e.preventDefault();const f=e.target;
 location.href=`mailto:haqfigo@gmail.com?subject=${encodeURIComponent('Portfolio: '+f.n.value)}&body=${encodeURIComponent(f.m.value+'\n\n'+f.n.value+' ('+f.e.value+')')}`};
$('#yr').textContent=new Date().getFullYear();
setL(L,0);
</script>
